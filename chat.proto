syntax = "proto3";

// ============================================================
// Chat service
// ============================================================

service ChatService {
  // Envía un mensaje a la conversación principal o a una rama.
  rpc SendMessage(SendMessageRequest) returns (Message);

  // Recupera mensajes de forma incremental.
  // after_sequence = 0 permite comenzar desde el inicio.
  rpc GetMessages(GetMessagesRequest) returns (stream Message);

  // Canal bidireccional para mensajes y eventos en tiempo real.
  rpc Connect(stream ClientEvent) returns (stream ServerEvent);

  // Crea una rama desde un mensaje existente.
  rpc ForkConversation(ForkConversationRequest)
      returns (Conversation);

  // Consulta los metadatos de una conversación.
  rpc GetConversation(GetConversationRequest)
      returns (Conversation);

  // Fija o desfija un mensaje.
  rpc SetMessagePinned(SetMessagePinnedRequest)
      returns (Message);
}

// ============================================================
// File service
// ============================================================

service FileService {
  // Consulta la disponibilidad de archivos identificados por hash.
  //
  // Se envía un hash por mensaje y se recibe una respuesta
  // por cada consulta, en el mismo orden.
  //
  // El primer hash debe incluir type.
  // Los siguientes pueden omitirlo para reutilizar el último
  // type explícito del mismo stream cliente-servidor.
  rpc QueryFiles(stream QueryFilesRequest)
      returns (stream QueryFilesResponse);

  // Sube un archivo mediante streaming.
  //
  // El primer mensaje contiene los metadatos del archivo.
  // Los mensajes siguientes contienen bloques de bytes.
  rpc UploadFile(stream UploadFileRequest)
      returns (UploadFileResponse);

  // Descarga un archivo identificado por su hash.
  rpc DownloadFile(DownloadFileRequest)
      returns (stream DownloadFileResponse);
}

// ============================================================
// Conversations
// ============================================================

message Conversation {
  // Identificador de la conversación.
  // La conversación principal no necesita identificador explícito.
  string conversation_id = 1;

  // Conversación de origen. Ausente para la conversación principal.
  optional string parent_conversation_id = 2;

  // Mensaje desde el que se creó esta rama.
  optional string forked_from_message_id = 3;

  // Nombre opcional para identificar el hilo.
  optional string title = 4;

  // Fecha de creación, en milisegundos Unix.
  int64 created_at = 5;

  // Indica si la conversación está archivada.
  bool archived = 6;
}

message ForkConversationRequest {
  // Conversación de origen.
  // Ausente para la conversación principal.
  optional string parent_conversation_id = 1;

  // Mensaje de origen de la bifurcación.
  string forked_from_message_id = 2;

  // Título opcional de la nueva rama.
  optional string title = 3;
}

message GetConversationRequest {
  // Ausente para la conversación principal.
  optional string conversation_id = 1;
}

// ============================================================
// Messages
// ============================================================

message Message {
  // Identificador estable del mensaje.
  string message_id = 1;

  // Secuencia incremental dentro de su conversación.
  uint64 sequence = 2;

  // Ausente para la conversación principal.
  optional string conversation_id = 3;

  // Contenido inmutable del mensaje.
  repeated ContentPart content = 4;

  // Estado de procesamiento.
  MessageStatus status = 5;

  // Fecha de creación, en milisegundos Unix.
  int64 created_at = 6;

  // Fecha de la última modificación del estado o de la fijación.
  int64 updated_at = 7;

  // Mensaje al que responde, si corresponde.
  optional string reply_to_message_id = 8;

  // Indica si está fijado.
  bool pinned = 9;

  // Metadatos extensibles en formato clave-valor.
  map<string, string> metadata = 10;

  // false = usuario; true = servicio.
  bool from_service = 11;
}

message SendMessageRequest {
  // Ausente para enviar a la conversación principal.
  optional string conversation_id = 1;

  // Contenido del mensaje.
  repeated ContentPart content = 2;

  // Referencia opcional al mensaje al que se responde.
  optional string reply_to_message_id = 3;

  // Evita duplicados cuando se reintenta una operación.
  optional string idempotency_key = 4;
}

message GetMessagesRequest {
  // Ausente para consultar la conversación principal.
  optional string conversation_id = 1;

  // Recupera mensajes cuya secuencia sea mayor que este valor.
  uint64 after_sequence = 2;

  // Número máximo de mensajes que se deben devolver.
  // 0 significa que se aplica el límite predeterminado del servidor.
  uint32 limit = 3;
}

message SetMessagePinnedRequest {
  string message_id = 1;

  // Ausente para la conversación principal.
  optional string conversation_id = 2;

  bool pinned = 3;
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_PENDING = 1;
  MESSAGE_STATUS_IN_PROGRESS = 2;
  MESSAGE_STATUS_COMPLETED = 3;
  MESSAGE_STATUS_FAILED = 4;
  MESSAGE_STATUS_CANCELLED = 5;
}

// ============================================================
// Message lifecycle events
// ============================================================

message MessageCreated {
  Message message = 1;
}

message MessageDeleted {
  string message_id = 1;

  // Ausente para la conversación principal.
  optional string conversation_id = 2;
}

message MessageStatusChanged {
  string message_id = 1;

  // Ausente para la conversación principal.
  optional string conversation_id = 2;

  MessageStatus status = 3;

  // Fecha del cambio de estado, en milisegundos Unix.
  int64 updated_at = 4;
}

message MessageProgress {
  string message_id = 1;

  // Progreso entre 0 y 1, si se conoce.
  optional float progress = 2;

  // Descripción del estado actual.
  optional string description = 3;
}

message SubscriptionReady {
  // Última secuencia disponible al confirmar la suscripción.
  uint64 latest_sequence = 1;
}

message ProtocolError {
  string code = 1;
  string message = 2;
}

// ============================================================
// Multimodal content
// ============================================================

message ContentPart {
  oneof kind {
    TextContent text = 1;
    FileReference file = 2;
    ImageContent image = 3;
    AudioContent audio = 4;
    StructuredContent structured = 5;
  }
}

message TextContent {
  string text = 1;
}

// ============================================================
// Content hashes
// ============================================================

message Hash {
  // Identifica el algoritmo de hash y su longitud de salida.
  //
  // Se define como el digest de una entrada vacía calculado
  // con ese algoritmo y esa longitud.
  //
  // Puede omitirse en QueryFilesRequest para reutilizar el último
  // type explícito del mismo stream cliente-servidor.
  optional bytes type = 1;

  // Digest del contenido.
  bytes value = 2;
}

// ============================================================
// File references
// ============================================================

message FileReference {
  // Hashes que identifican el mismo contenido.
  // Cada hash debe incluir type explícitamente.
  repeated Hash hashes = 1;

  // Nombre del archivo, si se conoce.
  optional string filename = 2;

  // Tipo MIME, si se conoce.
  optional string mime_type = 3;

  // Tamaño del archivo en bytes, si se conoce.
  optional uint64 size_bytes = 4;
}

message ImageContent {
  // Referencia al contenido de imagen almacenado.
  FileReference file = 1;

  // Descripción alternativa de la imagen.
  optional string alt_text = 2;
}

message AudioContent {
  // Referencia al contenido de audio almacenado.
  FileReference file = 1;

  // Transcripción del audio, si existe.
  optional string transcript = 2;

  // Duración del audio en milisegundos.
  optional uint64 duration_ms = 3;
}

message StructuredContent {
  // Tipo MIME del contenido.
  // Por ejemplo: application/json.
  string media_type = 1;

  // Datos serializados.
  bytes data = 2;
}

// ============================================================
// File queries
// ============================================================

message QueryFilesRequest {
  // Hash del archivo que se desea consultar.
  //
  // Si type está omitido, se utiliza el último type explícito
  // recibido en un Hash anterior del mismo stream.
  //
  // El primer hash del stream debe incluir type.
  Hash hash = 1;
}

message QueryFilesResponse {
  // Hash consultado, con type explícito.
  Hash hash = 1;

  // Indica si el contenido está disponible para el solicitante.
  bool available = 2;
}

// ============================================================
// File upload
// ============================================================

message UploadFileRequest {
  oneof part {
    // Debe aparecer una vez, al principio del stream.
    FileReference file = 1;

    // Bloque de datos del archivo.
    // Solo puede aparecer después de FileReference.
    bytes chunk = 2;
  }
}

message UploadFileResponse {
  // Referencia confirmada por el servidor, con los hashes
  // validados y el tamaño real del archivo.
  FileReference file = 1;
}

// ============================================================
// File download
// ============================================================

message DownloadFileRequest {
  // Hash que identifica el archivo.
  // type debe estar presente explícitamente.
  Hash hash = 1;
}

message DownloadFileResponse {
  // Bloque consecutivo del archivo.
  // El final del stream indica el final de la transferencia.
  bytes chunk = 1;
}

// ============================================================
// Real-time communication
// ============================================================

message ClientEvent {
  oneof event {
    SendMessageRequest send_message = 1;
    SubscribeRequest subscribe = 2;
    AcknowledgeEvent acknowledge = 3;
    CancelMessageRequest cancel_message = 4;
  }
}

message ServerEvent {
  oneof event {
    MessageCreated message_created = 1;
    MessageDeleted message_deleted = 2;
    MessageProgress message_progress = 3;
    SubscriptionReady subscription_ready = 4;
    ProtocolError error = 5;
    MessageStatusChanged message_status_changed = 6;
  }
}

message SubscribeRequest {
  // Ausente para la conversación principal.
  optional string conversation_id = 1;

  // Última secuencia procesada por el cliente.
  uint64 after_sequence = 2;
}

message AcknowledgeEvent {
  // Última secuencia procesada por el cliente.
  uint64 last_sequence = 1;
}

message CancelMessageRequest {
  string message_id = 1;

  // Ausente para la conversación principal.
  optional string conversation_id = 2;
}