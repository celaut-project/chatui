[package]
name = "wallet-ffi"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "flutter_rust_bridge FFI crate for Argus wallet — opaque handles, no secrets in Dart"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
wallet-core = { path = "../wallet-core" }
wallet-net = { path = "../wallet-net" }
celaut-client = { path = "../celaut-client" }
celaut-balancer = { workspace = true }
celaut-catalog = { workspace = true }
celaut-net = { workspace = true }
celaut-tor = { workspace = true }
celaut-wire = { workspace = true }
celaut-proto = { workspace = true }
ergo-lib = { workspace = true, features = ["mnemonic_gen"] }
ergo-tx = { workspace = true, features = ["ergo-lib"] }
ergopay-core = { workspace = true }
citadel-core = { workspace = true }
ergo-node-client = { workspace = true }
rand = { workspace = true }
flutter_rust_bridge = "=2.13.0"
once_cell = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
reqwest = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
