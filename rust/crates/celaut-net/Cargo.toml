[package]
name = "celaut-net"
description = "The network route of the app: direct, through a SOCKS5 proxy, or blocked, and a small SOCKS5 client and server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["net", "time", "io-util", "rt"] }
