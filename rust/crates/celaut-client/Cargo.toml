[package]
name = "celaut-client"
description = "Celaut client: the check of a node, quotes, start and stop of a service, and a local port for ServiceTunnel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
celaut-proto = { workspace = true }
celaut-wire = { workspace = true }
celaut-balancer = { workspace = true }
bee-rpc = { workspace = true }
prost = "0.14"
# HTTP/1.1 over a tunnel stream (http_tunnel.rs). All of them are already in the tree
# (tonic, reqwest); only features are asked here, no new crate.
http = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-stream = { version = "0.1", default-features = false }
futures = { workspace = true }
blake2 = "0.11"
ring = "0.17"
hex = { workspace = true }
sha3 = "0.10"
data-encoding = "2"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "net", "io-util", "rt", "fs", "sync"] }

[dev-dependencies]
tokio-stream = { version = "0.1", default-features = false }
tokio = { workspace = true, features = ["time", "net", "io-util", "rt", "test-util"] }
