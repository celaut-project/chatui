name: argus_wallet
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.19+20

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  share_plus: ^11.0.0
  file_picker: ^10.3.0
  url_launcher: ^6.3.1
  http: ^1.4.0
  crypto: ^3.0.7
  # The chat speaks gRPC (docs/celaut/chat.md); lib/celaut/chat/gen is made by
  # scripts/gen_chat_proto.sh from docs/celaut/chat.proto.
  grpc: 5.2.0
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  cupertino_icons: ^1.0.8
  uuid: ^4.0.0
  flutter_local_notifications: ^22.3.0
  flutter_zxing: ^3.1.0
  flutter_localizations:
    sdk: flutter
  characters: any
  intl: any
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The timings of navigation (integration_test/, test_driver/, docs/performance.md).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # Tests stand in a failing preferences store.
  shared_preferences_platform_interface: ^2.4.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Texts in lib/l10n/*.arb; flutter gen-l10n (or pub get) writes
  # lib/l10n/app_localizations*.dart.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    # Playfair Display (headings) and Lato (body), as on the Celaut
    # landing page. Both under the SIL OFL 1.1: see the *-OFL.txt files
    # next to them. The Playfair cuts are static instances of the Google
    # Fonts variable font (fontTools varLib.instancer, wght 500/700/800).
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf

# The Celaut mark: a Game-of-Life glider on a faint grid, coral and mint on
# deep teal. The adaptive foreground is the full icon, inset 16% so the
# glider stays inside the safe zone; the monochrome layer is the cells only,
# for Android 13 themed icons.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#12302E"
  adaptive_icon_foreground: assets/brand/icon.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  min_sdk_android: 21
